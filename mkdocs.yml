site_name: genbank_viewer
site_description: Local-first browser genome viewer
theme:
  name: material
nav:
  - Home: index.md
  - Use genbank_viewer: how-to-use-genbank_viewer.md
  - Installation: installation.md
  - Standalone and offline:
      - Overview: offline-installation.md
      - Windows: install-windows.md
      - Linux: install-linux.md
      - macOS: install-macos.md
      - Chromebook: install-chromebook.md
      - Verify offline operation: offline-verification.md
      - Update and uninstall: updating-and-uninstalling.md
      - Troubleshooting: troubleshooting-offline.md
  - Development: development.md
  - Architecture: architecture.md
  - Coordinates: coordinate-system.md
  - GenBank support: genbank-support.md
  - Translation: translation.md
  - Testing: testing.md
  - Troubleshooting: troubleshooting.md
  - Privacy and security: privacy-and-security.md
  - Accessibility: accessibility.md
  - Contributing: contributing.md
  - Roadmap: roadmap.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
strict: true
