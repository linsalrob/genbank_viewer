<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Webtemis screenshot placeholder</title>
  <desc id="desc">A labelled placeholder showing where a genome viewer screenshot should be regenerated.</desc>
  <rect width="1200" height="500" fill="#edf2f6"/>
  <rect x="40" y="40" width="1120" height="420" rx="12" fill="#fff" stroke="#8ca0b3" stroke-width="3"/>
  <text x="600" y="220" text-anchor="middle" font-family="system-ui" font-size="34" fill="#173e51">Webtemis viewer screenshot</text>
  <text x="600" y="275" text-anchor="middle" font-family="system-ui" font-size="20" fill="#526475">Load test-data/two_records.gbk and replace this placeholder</text>
  <path d="M150 350h220l30-20 30 20h220" fill="none" stroke="#147d64" stroke-width="20"/>
  <path d="M1050 390H830l-30-20-30 20H550" fill="none" stroke="#8f4261" stroke-width="20"/>
</svg>
