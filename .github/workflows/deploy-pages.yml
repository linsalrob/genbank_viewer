name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --workspace

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build WebAssembly package
        working-directory: web
        run: npm run build:wasm

      - name: Check frontend
        working-directory: web
        run: npm run check

      - name: Test frontend
        working-directory: web
        run: npm run test

      - name: Build production site
        working-directory: web
        run: npm run build

      - name: Verify Pages assets
        run: |
          test -f web/dist/index.html
          find web/dist -type f -name '*.wasm' -print -quit | grep -q .
          grep -q '"/genbank_viewer/assets/' web/dist/index.html
          if grep -Eq '(src|href)="/assets/' web/dist/index.html; then
            echo "Found an asset URL that incorrectly assumes deployment at /" >&2
            exit 1
          fi

      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Test production site
        working-directory: web
        run: npm run test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
